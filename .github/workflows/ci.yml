name: CI
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Spec, format, static analysis and shared compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
      - uses: ./.github/actions/setup-dev
      - run: make tools-go
      - run: make tools-check check
      - run: git diff --exit-code
  c:
    name: C / ${{ matrix.cc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang-18]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y clang-18
      - run: make test-c CC=${{ matrix.cc }} CFLAGS='-O2 -g -std=c11 -Werror' CPPFLAGS='-Iinclude -Ic/include -Ibuild' LDFLAGS=''
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - run: make test-sanitize CC=clang-18
  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - run: make fuzz-smoke FUZZ_CC=clang-18
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
      - run: make tools-go
      - run: make test-go lint-go nilaway fuzz-go
      - run: make vuln
