# Adapted from fsledger v2.13.2: correctness/security checks and strict errors.
# Style-only all-linter policy is not inherited; public wire/API layouts stay explicit.
version: "2"
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
linters:
  default: none
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/inode64/exim-observer-protocol/
    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true
    govet:
      enable-all: true
      disable:
        # Preserve intentional public API field ordering.
        - fieldalignment
    staticcheck:
      checks:
        - all
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    presets: []
    warn-unused: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - depguard
    - bodyclose
    - durationcheck
    - errorlint
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - reassign
    - recvcheck
    - sqlclosecheck
    - rowserrcheck
    - copyloopvar
formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/inode64/exim-observer-protocol
  exclusions:
    generated: strict
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
